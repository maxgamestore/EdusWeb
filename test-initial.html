            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;

        }

        input[type="text"]:focus {

            border-color: #667eea;
        }

        .btn-trimite {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            border: none;
            border-radius: 10px;
            margin-top: 20px;
            transition: opacity 0.2s;

        }

        .btn-trimite:hover:not(:disabled) {

        }

        function alegeRandom() {
            const categorii = ['parte_vorbire', 'verbe_mod_timp', 'substantive', 'adjective', 'figuri_stil'];
            const selectate = [];

            for (const cat of categorii) {
                const dinCategorie = BANCA_INTREBARI.filter(q => q.categorie === cat);
                for (let i = dinCategorie.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [dinCategorie[i], dinCategorie[j]] = [dinCategorie[j], dinCategorie[i]];
                }
                selectate.push(...dinCategorie.slice(0, 10));
            }

            for (let i = selectate.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [selectate[i], selectate[j]] = [selectate[j], selectate[i]];
            }

            return selectate;
        }

      `).join('');
        }

        function normalize(s) {
            return String(s || '')
                .toLowerCase()
                .replace(/[ăâ]/g, 'a')
                .replace(/î/g, 'i')
                .replace(/ș/g, 's')
                .replace(/ț/g, 't')
                .replace(/[.,!?;:()„"«»\-—…]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function levenshtein(a, b) {
            a = a || '';
            b = b || '';
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;

            const matrice = [];
            for (let i = 0; i <= b.length; i++) matrice[i] = [i];
            for (let j = 0; j <= a.length; j++) matrice[0][j] = j;

            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrice[i][j] = matrice[i - 1][j - 1];
                    } else {
                        matrice[i][j] = Math.min(
                            matrice[i - 1][j - 1] + 1,
                            matrice[i][j - 1] + 1,
                            matrice[i - 1][j] + 1
                        );
                    }
                }
            }
            return matrice[b.length][a.length];
        }

        function esteCorect(raspunsElev, raspunsCorect) {
            const a = normalize(raspunsElev);
            const b = normalize(raspunsCorect);

            if (a === b) return true;
            if (!a) return false;

            const dist = levenshtein(a, b);
            return dist <= 2;
        }

        async function trimiteTest() {
            const btn = document.getElementById('btn-trimite');
            btn.disabled = true;
            btn.textContent = 'Se corectează...';

            const raspunsuri = {};
            for (const q of INTREBARI) {
                raspunsuri[q.id] = document.getElementById(`raspuns-${q.id}`).value;
            }

            const scoruri = {};
            for (const q of INTREBARI) {
                if (!scoruri[q.categorie]) {
                    scoruri[q.categorie] = { corecte: 0, total: 0 };
                }
                scoruri[q.categorie].total++;

                if (esteCorect(raspunsuri[q.id], q.raspuns)) {
                    scoruri[q.categorie].corecte++;
                }
            }

            try {
                const res = await fetch(`${window.EDUSWEB_API}/calibrare`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: user.id,
                        materie: materieKey,
                        scoruri: scoruri
                    })
                });

                const data = await res.json();
                if (!data.ok) throw new Error(data.eroare || 'Eroare la salvare');

                let totalCorecte = 0;
                for (const cat in scoruri) totalCorecte += scoruri[cat].corecte;
                const totalIntrebari = INTREBARI.length;
                const procentTotal = Math.round((totalCorecte / totalIntrebari) * 100);

                afiseazaRezultat(totalCorecte, totalIntrebari, procentTotal);

            } catch (err) {
                alert('Eroare: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Trimite testul';
            }
        }

        function afiseazaRezultat(corecte, total, procent) {
            document.body.innerHTML = `
        <div class="container">
          <div class="header" style="background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);">
            <h1>✅ Test finalizat!</h1>
            <p>Rezultatul tău a fost înregistrat.</p>
          </div>

          <div class="rezultat-box">
            <h2>Scorul tău</h2>
            <div class="scor">${corecte} / ${total}</div>
            <p style="font-size: 18px; font-weight: 600;">${procent}%</p>
          </div>

          <p style="text-align: center; color: #666; margin-top: 20px;">
            Vei fi redirecționat către pagina materiei...
          </p>
        </div>
      `;

            setTimeout(() => {
                window.location.href = `/materie/${materieKey}`;
            }, 3000);
        }

        render();
    </script>
